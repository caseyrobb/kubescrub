name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build linux/amd64
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X github.com/caseyrobb/kubescrub/internal/apply.Version=${GITHUB_REF_NAME}" -o kubescrub-linux-amd64 ./cmd/kubescrub
          sha256sum kubescrub-linux-amd64 > kubescrub-linux-amd64.sha256

      - name: Build linux/arm64
        run: |
          GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X github.com/caseyrobb/kubescrub/internal/apply.Version=${GITHUB_REF_NAME}" -o kubescrub-linux-arm64 ./cmd/kubescrub
          sha256sum kubescrub-linux-arm64 > kubescrub-linux-arm64.sha256

      - name: Build darwin/amd64
        run: |
          GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X github.com/caseyrobb/kubescrub/internal/apply.Version=${GITHUB_REF_NAME}" -o kubescrub-darwin-amd64 ./cmd/kubescrub
          sha256sum kubescrub-darwin-amd64 > kubescrub-darwin-amd64.sha256

      - name: Build darwin/arm64
        run: |
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X github.com/caseyrobb/kubescrub/internal/apply.Version=${GITHUB_REF_NAME}" -o kubescrub-darwin-arm64 ./cmd/kubescrub
          sha256sum kubescrub-darwin-arm64 > kubescrub-darwin-arm64.sha256

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kubescrub-linux-amd64
            kubescrub-linux-amd64.sha256
            kubescrub-linux-arm64
            kubescrub-linux-arm64.sha256
            kubescrub-darwin-amd64
            kubescrub-darwin-amd64.sha256
            kubescrub-darwin-arm64
            kubescrub-darwin-arm64.sha256
          generate_release_notes: true
