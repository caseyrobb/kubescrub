name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - GOOS: linux
            GOARCH: amd64
            ASSET: kubescrub-linux-amd64
          - GOOS: linux
            GOARCH: arm64
            ASSET: kubescrub-linux-arm64
          - GOOS: darwin
            GOARCH: amd64
            ASSET: kubescrub-darwin-amd64
          - GOOS: darwin
            GOARCH: arm64
            ASSET: kubescrub-darwin-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: |
          CGO_ENABLED=0 go build -ldflags "-s -w -X github.com/caseyrobb/kubescrub/internal/apply.Version=${{ github.ref_name }}" -o ${{ matrix.ASSET }} ./cmd/kubescrub
          sha256sum ${{ matrix.ASSET }} > ${{ matrix.ASSET }}.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.ASSET }}
            ${{ matrix.ASSET }}.sha256
